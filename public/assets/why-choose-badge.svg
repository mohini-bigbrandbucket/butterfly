<svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Outer rings -->
  <circle cx="110" cy="110" r="104" fill="none" stroke="#D6A02E" stroke-width="1" opacity="0.35"/>
  <circle cx="110" cy="110" r="96" fill="none" stroke="#D6A02E" stroke-width="1.4" opacity="0.6"/>

  <!-- Laurel wreath -->
  <g>
    <ellipse cx="187.1" cy="156.0" rx="4.0" ry="11.0" transform="rotate(20.0 187.1 156.0)" fill="none" stroke="#D6A02E" stroke-width="1.6"/>
    <ellipse cx="174.6" cy="178.5" rx="4.0" ry="11.0" transform="rotate(38.0 174.6 178.5)" fill="none" stroke="#D6A02E" stroke-width="1.6"/>
    <ellipse cx="155.9" cy="196.0" rx="4.0" ry="11.0" transform="rotate(56.0 155.9 196.0)" fill="none" stroke="#D6A02E" stroke-width="1.6"/>
    <ellipse cx="132.6" cy="206.8" rx="4.0" ry="11.0" transform="rotate(74.0 132.6 206.8)" fill="none" stroke="#D6A02E" stroke-width="1.6"/>
    <ellipse cx="107.1" cy="210.0" rx="4.0" ry="11.0" transform="rotate(92.0 107.1 210.0)" fill="none" stroke="#D6A02E" stroke-width="1.6"/>
    <ellipse cx="32.9" cy="156.0" rx="4.0" ry="11.0" transform="rotate(160.0 32.9 156.0)" fill="none" stroke="#D6A02E" stroke-width="1.6"/>
    <ellipse cx="45.4" cy="178.5" rx="4.0" ry="11.0" transform="rotate(142.0 45.4 178.5)" fill="none" stroke="#D6A02E" stroke-width="1.6"/>
    <ellipse cx="64.1" cy="196.0" rx="4.0" ry="11.0" transform="rotate(124.0 64.1 196.0)" fill="none" stroke="#D6A02E" stroke-width="1.6"/>
    <ellipse cx="87.4" cy="206.8" rx="4.0" ry="11.0" transform="rotate(106.0 87.4 206.8)" fill="none" stroke="#D6A02E" stroke-width="1.6"/>
    <ellipse cx="112.9" cy="210.0" rx="4.0" ry="11.0" transform="rotate(88.0 112.9 210.0)" fill="none" stroke="#D6A02E" stroke-width="1.6"/>
  </g>

  <!-- Globe (global certification) -->
  <g stroke="#002b4f" stroke-width="1.6" fill="none">
    <circle cx="110" cy="118" r="46"/>
    <ellipse cx="110" cy="118" rx="46" ry="17"/>
    <ellipse cx="110" cy="118" rx="20" ry="46"/>
    <line x1="64" y1="118" x2="156" y2="118"/>
  </g>

  <!-- Butterfly perched on top of the globe -->
  <g transform="translate(110 60)">
    <!-- antennae -->
    <path d="M0 -8 C -3 -14 -5 -16 -8 -19" fill="none" stroke="#002b4f" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M0 -8 C 3 -14 5 -16 8 -19" fill="none" stroke="#002b4f" stroke-width="1.2" stroke-linecap="round"/>
    <!-- left upper wing -->
    <path d="M-1 -7 C -8 -19 -24 -22 -30 -12 C -35 -3 -27 6 -14 4 C -6 3 -2 -2 -1 -7 Z" fill="#D6A02E" opacity="0.92"/>
    <!-- left lower wing -->
    <path d="M-1 2 C -7 6 -17 10 -18 19 C -19 26 -11 28 -6 22 C -2 17 -1 8 -1 2 Z" fill="#E7BE63" opacity="0.92"/>
    <!-- right upper wing -->
    <path d="M1 -7 C 8 -19 24 -22 30 -12 C 35 -3 27 6 14 4 C 6 3 2 -2 1 -7 Z" fill="#D6A02E" opacity="0.92"/>
    <!-- right lower wing -->
    <path d="M1 2 C 7 6 17 10 18 19 C 19 26 11 28 6 22 C 2 17 1 8 1 2 Z" fill="#E7BE63" opacity="0.92"/>
    <!-- body -->
    <path d="M0 -9 C -1.4 -6 -1.6 8 0 15 C 1.6 8 1.4 -6 0 -9 Z" fill="#002b4f"/>
  </g>

  <!-- small accent dots -->
  <circle cx="110" cy="16" r="2" fill="#D6A02E"/>
  <circle cx="30" cy="100" r="1.6" fill="#D6A02E" opacity="0.7"/>
  <circle cx="190" cy="100" r="1.6" fill="#D6A02E" opacity="0.7"/>
</svg>
